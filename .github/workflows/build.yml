name: Build Raingel Control IPA

on:
  push:
    branches: [main]
    paths:
      - "RaingelControl/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: RaingelControl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project RaingelControl.xcodeproj \
            -scheme RaingelControl \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RaingelControl.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/RaingelControl.xcarchive/Products/Applications/RaingelControl.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/RaingelControl-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaingelControl-unsigned-IPA
          path: RaingelControl-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
